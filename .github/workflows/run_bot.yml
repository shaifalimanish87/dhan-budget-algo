name: Run Trading Bot Daily

on:
  schedule:
    # IST 9:15 AM to 3:30 PM (UTC 3:45 AM to 10:00 AM) - Every 15 mins
    - cron: '45 3 * * 1-5'        # 03:45 AM UTC = 09:15 AM IST (Market Open)
    - cron: '*/15 4-9 * * 1-5'    # 04:00 AM to 09:45 AM UTC = 09:30 AM to 03:15 PM IST
    - cron: '0,15,30 10 * * 1-5'  # 10:00 AM to 10:30 AM UTC = 03:30 PM to 04:00 PM IST
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pytz

      - name: Run Script
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u Parshwa87bot.py
